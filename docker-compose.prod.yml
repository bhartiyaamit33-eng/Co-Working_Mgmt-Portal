# Full stack for a public demo: nginx (UI) + FastAPI + MongoDB.
# Usage: docker compose -f docker-compose.prod.yml up --build -d
#
# Testers open http://<host>/  — the UI talks to /api on the same origin.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - coworking_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-coworking}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ideas.iitb@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ADMIN_SYNC_ON_START: ${ADMIN_SYNC_ON_START:-true}
      MEMBER_EMAIL_DOMAIN: ${MEMBER_EMAIL_DOMAIN:-iitb.ac.in}
      MEMBER_EMAIL_DOMAINS: ${MEMBER_EMAIL_DOMAINS:-iitb.ac.in,iitbombay.org}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      SES_FROM: ${SES_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  coworking_mongo_data:
